<!doctype html>
<html dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;800;900&display=swap">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// فيلم مناسبتي: يُرسم إطاراً إطاراً بشكل حتمي (render(t)) ثم يُصدَّر فيديو.
const Q = new URLSearchParams(location.search);
const W = +Q.get("w") || 1920, H = +Q.get("h") || 1080, MODE = Q.get("mode") || "film";
const c = document.getElementById("c"); c.width = W; c.height = H;
const x = c.getContext("2d");
const BODY = new Path2D("M14 92V24L21 10L28 24L35 10L42 24L50 8L58 24L65 10L72 24L79 10L86 24V92ZM38 92V60C38 48 43.5 41 50 37C56.5 41 62 48 62 60V92ZM22 31L26 28L30 31L26 34ZM34 31L38 28L42 31L38 34ZM46 31L50 28L54 31L50 34ZM58 31L62 28L66 31L62 34ZM70 31L74 28L78 31L74 34ZM23 56L28 47L33 56ZM67 56L72 47L77 56Z");
const OUTLINE = new Path2D("M14 92V24L21 10L28 24L35 10L42 24L50 8L58 24L65 10L72 24L79 10L86 24V92ZM38 92V60C38 48 43.5 41 50 37C56.5 41 62 48 62 60V92");
const ARCH = new Path2D("M38 92V60C38 48 43.5 41 50 37C56.5 41 62 48 62 60V92Z");
const STAR = new Path2D("M50 59L52.6 66.4L60 69L52.6 71.6L50 79L47.4 71.6L40 69L47.4 66.4Z");
const OUT_LEN = 700;
const SCENES = [
  { img: "f1-wedding", word: "زواج", sub: "قاعات · كوشة · زفّة", tint: "#ff7a3d" },
  { img: "f2-milka", word: "ملكة", sub: "ورد · شموع · لحظة العمر", tint: "#ff4f8b" },
  { img: "f3-coffee", word: "ضيافة", sub: "قهوة · تمر · دلّة", tint: "#ffb547" },
  { img: "f4-rooftop", word: "تخرّج", sub: "إطلالة · عشاء · احتفال", tint: "#6f7bff" },
  { img: "f5-desert", word: "لمّة", sub: "خيمة · نار · سماء نجد", tint: "#ff8a3d" },
];
const imgs = {};
const load = (k) => new Promise((r) => { const i = new Image(); i.onload = () => { imgs[k] = i; r(); }; i.src = `../../media-src/film/${k}.png`; });

// توقيت
const INTRO = 2.4, DOOR = 1.15, HOLD = MODE === "film" ? 2.5 : 2.2, OUTRO = MODE === "film" ? 3.4 : 0;
const SEG = HOLD + DOOR; // كل مشهد: ثبات ثم باب للمشهد التالي
const TOTAL = INTRO + DOOR + SCENES.length * SEG - (MODE === "film" ? 0 : 0) + OUTRO;
window.TOTAL = TOTAL;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const S = Math.min(W, H);

function grad(k) {
  const g = x.createLinearGradient(0, 8 * k, 0, 92 * k);
  g.addColorStop(0, "#FFB547"); g.addColorStop(0.35, "#FF5A3C"); g.addColorStop(0.7, "#E5195E"); g.addColorStop(1, "#6A1B9A");
  return g;
}

// يرسم صورة تغطي الشاشة مع تكبير s وانزياح
function cover(img, s, dx = 0, dy = 0) {
  const r = Math.max(W / img.width, H / img.height) * s;
  const w = img.width * r, h = img.height * r;
  x.drawImage(img, (W - w) / 2 + dx * W, (H - h) / 2 + dy * H, w, h);
}

function grade(tint, a) {
  x.save();
  const v = x.createRadialGradient(W / 2, H / 2, S * 0.25, W / 2, H / 2, Math.hypot(W, H) * 0.62);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(5,2,10,.78)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = "soft-light"; x.globalAlpha = 0.35 * a; x.fillStyle = tint; x.fillRect(0, 0, W, H);
  x.restore();
}

function lightLeak(p, tint) {
  x.save(); x.globalCompositeOperation = "screen";
  const cx = W * (1.1 - p * 1.4), cy = H * 0.25;
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, S * 0.9);
  g.addColorStop(0, tint + "55"); g.addColorStop(0.5, tint + "18"); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore();
}

// خلفية الليل للمقدمة والخاتمة
function night(t) {
  x.fillStyle = "#08040e"; x.fillRect(0, 0, W, H);
  const g = x.createRadialGradient(W / 2, H * 0.55, 0, W / 2, H * 0.55, S * 0.9);
  g.addColorStop(0, "rgba(229,25,94,.22)"); g.addColorStop(0.5, "rgba(106,27,154,.12)"); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // نجوم ثابتة تتلألأ
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 160; i++) {
    const sx = rnd() * W, sy = rnd() * H * 0.8, r = rnd() * 1.4 + 0.3, ph = rnd() * 6.28;
    x.fillStyle = `rgba(255,236,210,${0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + ph))})`;
    x.fillRect(sx, sy, r, r);
  }
}

// البوابة في موضع: k وحدة→بكسل، ومركز الباب (50,66) على (cx,cy)
let AY = 50; // نقطة الارتكاز الرأسية داخل البوابة (50 = منتصف البوابة، 66 = منتصف الباب)
function gateTransform(k, cx = W / 2, cy = H / 2) { x.translate(cx - 50 * k, cy - AY * k); x.scale(k, k); }

function drawGate(k, opts) {
  const { fill = 1, stroke = 1, draw = 1, star = 1, starA = 1, glow = 1, inside } = opts;
  x.save(); gateTransform(k);
  if (fill > 0) {
    x.save(); x.globalAlpha = fill; x.fillStyle = grad(1); x.fill(BODY, "evenodd"); x.restore();
  }
  if (inside) { x.save(); x.clip(ARCH); x.setTransform(1, 0, 0, 1, 0, 0); inside(); x.restore(); }
  if (stroke > 0) {
    x.save(); x.lineJoin = "round"; x.lineCap = "round";
    x.setLineDash([OUT_LEN * draw, OUT_LEN]); x.lineWidth = 1.1;
    x.shadowColor = "rgba(255,120,80,.95)"; x.shadowBlur = 28 * glow;
    x.strokeStyle = grad(1); x.globalAlpha = stroke; x.stroke(OUTLINE);
    x.shadowBlur = 8; x.strokeStyle = "rgba(255,240,220,.9)"; x.lineWidth = 0.35; x.stroke(OUTLINE);
    x.restore();
  }
  if (star > 0 && starA > 0) {
    x.save(); x.globalAlpha = starA; x.translate(50, 69); x.scale(star, star); x.translate(-50, -69);
    x.shadowColor = "rgba(255,210,122,1)"; x.shadowBlur = 40; x.fillStyle = "#FFE3A3"; x.fill(STAR);
    x.restore();
  }
  x.restore();
  if (star > 0.6 && glow > 0 && starA > 0) { // أشعة النجمة
    x.save(); x.globalCompositeOperation = "screen"; x.globalAlpha = starA;
    const sx = W / 2, sy = H / 2 + (69 - AY) * k;
    const g = x.createRadialGradient(sx, sy, 0, sx, sy, k * 30 * star);
    g.addColorStop(0, "rgba(255,214,140,.55)"); g.addColorStop(1, "rgba(255,214,140,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore();
  }
}

function scene(i, local) {
  const s = SCENES[i];
  const p = clamp(local / (HOLD + DOOR));
  cover(imgs[s.img], 1.04 + 0.1 * p, (i % 2 ? -0.015 : 0.015) * p, 0);
  grade(s.tint, 1);
  lightLeak(p, s.tint);
}

function word(i, local) {
  const s = SCENES[i];
  const a = clamp(local / 0.55), out = clamp((local - (HOLD - 0.35)) / 0.35);
  const vis = easeOut(a) * (1 - out);
  if (vis <= 0) return;
  x.save();
  const fs = Math.round(S * (W > H ? 0.26 : 0.2));
  x.font = `900 ${fs}px Alexandria`; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.direction = "rtl";
  const y = H * (W > H ? 0.6 : 0.56) + (1 - easeOut(a)) * fs * 0.25 - out * fs * 0.1;
  x.globalAlpha = vis;
  x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = 40;
  // كشف بقناع يتسع من المركز
  x.beginPath(); const half = (W / 2) * easeOut(clamp(local / 0.7)); x.rect(W / 2 - half, 0, half * 2, H); x.clip();
  x.fillStyle = "#fff"; x.fillText(s.word, W / 2, y);
  x.shadowBlur = 0; x.font = `500 ${Math.round(fs * 0.17)}px Alexandria`; x.globalAlpha = vis * 0.88;
  x.fillText(s.sub, W / 2, y + fs * 0.32);
  x.restore();
}

function outro(local) {
  night(local + 20);
  const a = easeOut(clamp(local / 1.0));
  const k = S * 0.0034 * (0.85 + 0.15 * a);
  x.save(); x.globalAlpha = a;
  x.translate(W / 2 - 50 * k, H * (W > H ? 0.36 : 0.38) - 50 * k); x.scale(k, k);
  x.shadowColor = "rgba(255,90,60,.6)"; x.shadowBlur = 60; x.fillStyle = grad(1); x.fill(BODY, "evenodd");
  x.shadowColor = "rgba(255,210,122,1)"; x.shadowBlur = 30; x.fillStyle = "#FFE3A3"; x.fill(STAR);
  x.restore();
  const b = easeOut(clamp((local - 0.45) / 0.8));
  x.save(); x.globalAlpha = b; x.fillStyle = "#fff"; x.textAlign = "center"; x.direction = "rtl";
  const fs = Math.round(S * 0.15);
  x.font = `800 ${fs}px Alexandria`; x.fillText("مناسبتي", W / 2, H * (W > H ? 0.75 : 0.66) + (1 - b) * 30);
  const cc = easeOut(clamp((local - 0.9) / 0.8));
  x.globalAlpha = cc * 0.85; x.font = `500 ${Math.round(fs * 0.3)}px Alexandria`;
  x.fillText("من الفكرة لآخر ضيف", W / 2, H * (W > H ? 0.75 : 0.66) + fs * 0.78);
  x.restore();
  // لمعة تعبر الشعار
  const sw = clamp((local - 1.2) / 1.0);
  if (sw > 0 && sw < 1) {
    x.save(); x.globalCompositeOperation = "screen";
    const gx = W * (1.2 - sw * 1.4);
    const g = x.createLinearGradient(gx - S * 0.2, 0, gx + S * 0.2, 0);
    g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,230,200,.18)"); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore();
  }
}

// العبور عبر الباب: k يكبر أسياً حتى يغطي الباب الشاشة
function door(p, behind, next, nextScale) {
  const k0 = S * 0.0062, k1 = (W / 24) * 1.25 * Math.max(1, (H / W) * 2.3);
  const e = easeIn(p) * 0.85 + ease(p) * 0.15;
  const k = k0 * Math.pow(k1 / k0, e);
  AY = 50 + 16 * easeOut(clamp(p * 1.6));
  behind();
  x.save(); x.fillStyle = `rgba(6,3,10,${0.55 * clamp(p * 2)})`; x.fillRect(0, 0, W, H); x.restore();
  drawGate(k, { fill: 1, stroke: 1 - clamp(p * 1.5), draw: 1, star: 1, starA: 1 - clamp(p * 2.2), glow: 1 - p, inside: () => { x.save(); next(nextScale(p)); x.restore(); } });
  // النجمة تتلاشى أثناء العبور
}

window.render = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
  if (t < INTRO) { // رسم البوابة بالضوء
    AY = 50; night(t);
    const d = easeOut(clamp(t / 1.5));
    const f = clamp((t - 1.3) / 0.8), st = easeOut(clamp((t - 1.5) / 0.6));
    drawGate(S * 0.0062, { fill: f * 0.9, stroke: 1, draw: d, star: st, glow: 1 });
    return;
  }
  let u = t - INTRO;
  if (u < DOOR) { door(u / DOOR, () => night(t), (s) => cover(imgs[SCENES[0].img], s), (p) => 1.35 - 0.31 * easeOut(p)); return; }
  u -= DOOR;
  const i = Math.floor(u / SEG), local = u - i * SEG;
  if (i < SCENES.length) {
    if (local < HOLD) { scene(i, local); if (MODE === "film") word(i, local); return; }
    const p = (local - HOLD) / DOOR;
    if (i < SCENES.length - 1) door(p, () => scene(i, local), (s) => { cover(imgs[SCENES[i + 1].img], s); }, (q) => 1.35 - 0.31 * easeOut(q));
    else if (MODE === "film") door(p, () => scene(i, local), () => outro(0), () => 1);
    else door(p, () => scene(i, local), () => night(0), () => 1);
    return;
  }
  outro(u - SCENES.length * SEG);
};

window.ready = Promise.all([...SCENES.map((s) => load(s.img)), document.fonts.load("900 100px Alexandria"), document.fonts.load("800 100px Alexandria"), document.fonts.load("500 40px Alexandria")]).then(() => document.fonts.ready);
</script></body></html>
