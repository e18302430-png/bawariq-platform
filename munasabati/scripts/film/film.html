<!doctype html>
<html dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;800;900&display=swap">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// فيلم مناسبتي (بدون شعار): انتقالات بشق ضوئي + حياة داخل كل مشهد (غبار ذهبي، بخار، شرر، أضواء).
// يُرسم إطاراً إطاراً بشكل حتمي عبر render(t).
const Q = new URLSearchParams(location.search);
const W = +Q.get("w") || 1920, H = +Q.get("h") || 1080, MODE = Q.get("mode") || "film";
const c = document.getElementById("c"); c.width = W; c.height = H;
const x = c.getContext("2d");
const S = Math.min(W, H);

// fx: نوع الحياة داخل المشهد، و(ax, ay) موضع المصدر داخل الصورة (نسبة من عرضها وارتفاعها)
const SCENES = [
  { img: "f1-wedding", word: "زواج", sub: "قاعات · كوشة · زفّة", tint: "#ff8a3d", fx: "dust", ax: 0.5, ay: 0.4 },
  { img: "f2-milka", word: "ملكة", sub: "ورد · شموع · لحظة العمر", tint: "#ff5c93", fx: "candles", ax: 0.5, ay: 0.85 },
  { img: "f3-coffee", word: "ضيافة", sub: "قهوة · تمر · دلّة", tint: "#ffb547", fx: "steam", ax: 0.47, ay: 0.6 },
  { img: "f4-rooftop", word: "تخرّج", sub: "إطلالة · عشاء · احتفال", tint: "#7b86ff", fx: "city", ax: 0.5, ay: 0.4 },
  { img: "f5-desert", word: "لمّة", sub: "خيمة · نار · سماء نجد", tint: "#ff7a2e", fx: "sparks", ax: 0.5, ay: 0.6 },
];
const imgs = {};
const load = (k) => new Promise((r) => { const i = new Image(); i.onload = () => { imgs[k] = i; r(); }; i.src = `../../media-src/film/${k}.png`; });

const HOLD = MODE === "film" ? 2.7 : 2.6, TRANS = 0.95, SEG = HOLD + TRANS;
const INTRO = MODE === "film" ? 1.4 : 0, OUTRO = MODE === "film" ? 3.2 : 0;
// الفيلم: مقدمة ← 5 مشاهد ← خاتمة. نسخة الواجهة: حلقة متصلة تبدأ من المشهد الأول وتعود إليه.
const TOTAL = MODE === "film" ? INTRO + (SCENES.length - 1) * SEG + HOLD + OUTRO : SCENES.length * SEG;
window.TOTAL = TOTAL;

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const rand = (seed) => { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); };

function cover(img, s, dx = 0) {
  const r = Math.max(W / img.width, H / img.height) * s;
  const w = img.width * r, h = img.height * r, ox = (W - w) / 2 + dx * W, oy = (H - h) / 2;
  x.drawImage(img, ox, oy, w, h);
  return (u, v) => [ox + u * w, oy + v * h];
}

function grade(tint) {
  x.save();
  const v = x.createRadialGradient(W / 2, H * 0.48, S * 0.3, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(4,2,8,.72)");
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  x.globalCompositeOperation = "soft-light"; x.globalAlpha = 0.28; x.fillStyle = tint; x.fillRect(0, 0, W, H);
  x.restore();
}

function glowDot(px, py, rad, color, a) {
  if (a <= 0.003) return;
  const g = x.createRadialGradient(px, py, 0, px, py, rad);
  g.addColorStop(0, color.replace("A", a.toFixed(3))); g.addColorStop(1, color.replace("A", "0"));
  x.fillStyle = g; x.beginPath(); x.arc(px, py, rad, 0, Math.PI * 2); x.fill();
}

// ── الحياة داخل المشاهد ──
function fx(scene, t, map) {
  x.save(); x.globalCompositeOperation = "screen";
  const [cx, cy] = map(scene.ax, scene.ay);
  const R = rand(scene.img.length * 977 + 13);
  const k = S / 1080;
  if (scene.fx === "dust") {
    for (let i = 0; i < 140; i++) {
      const bx = R() * W, by = R() * H, sp = 8 + R() * 22, ph = R() * 6.28, sz = (R() * 2.2 + 0.6) * k;
      const px = bx + Math.sin(t * 0.6 + ph) * 30 * k, py = ((by - t * sp * k) % H + H) % H;
      glowDot(px, py, sz * 4, "rgba(255,214,150,A)", (0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.2 + ph))) * 0.55);
    }
    const beam = 0.5 + 0.5 * Math.sin(t * 1.4);
    const g = x.createLinearGradient(cx - S * 0.2, 0, cx + S * 0.2, H);
    g.addColorStop(0, "rgba(255,200,130,0)"); g.addColorStop(0.5, `rgba(255,200,130,${0.05 + 0.06 * beam})`); g.addColorStop(1, "rgba(255,200,130,0)");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
  if (scene.fx === "candles") {
    for (let i = 0; i < 70; i++) {
      const px = R() * W, py = H * (0.55 + R() * 0.45), ph = R() * 6.28, sz = (6 + R() * 16) * k, f1 = 7 + R() * 5;
      const fl = 0.55 + 0.45 * Math.sin(t * f1 + ph) * Math.sin(t * 3.1 + ph * 2);
      glowDot(px, py, sz * 3, "rgba(255,190,120,A)", 0.16 + 0.2 * fl);
    }
    for (let i = 0; i < 30; i++) {
      const bx = R() * W, by = R() * H, sp = 10 + R() * 14, sz = (R() * 3 + 1) * k;
      glowDot(bx + Math.sin(t + i) * 20 * k, (by + t * sp * k) % H, sz * 5, "rgba(255,170,200,A)", 0.22);
    }
  }
  if (scene.fx === "steam") {
    for (let i = 0; i < 26; i++) {
      const life = (t * 0.55 + i / 26) % 1, ph = i * 1.7, jit = (R() - 0.5) * S * 0.02;
      const px = cx + Math.sin(life * 5 + ph + t * 0.8) * S * 0.035 * (0.4 + life) + jit;
      glowDot(px, cy - life * S * 0.42, S * (0.025 + life * 0.07), "rgba(255,240,225,A)", 0.15 * Math.sin(Math.PI * life));
    }
    for (let i = 0; i < 40; i++) { const px = R() * W, py = R() * H, ph = R() * 6.28; glowDot(px, py, S * 0.012, "rgba(255,190,110,A)", 0.1 + 0.1 * Math.sin(t * 1.5 + ph)); }
  }
  if (scene.fx === "city") {
    for (let i = 0; i < 160; i++) {
      const px = R() * W, py = H * (0.18 + R() * 0.32), ph = R() * 6.28, sz = (R() * 1.6 + 0.6) * k, sp = 2 + R() * 4, blue = R() > 0.7;
      glowDot(px, py, sz * 4, blue ? "rgba(140,170,255,A)" : "rgba(255,220,160,A)", 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(t * sp + ph)));
    }
    for (let i = 0; i < 18; i++) glowDot((i + 0.5) / 18 * W, H * 0.05 + Math.sin(i * 0.9) * H * 0.03, S * 0.02, "rgba(255,215,150,A)", 0.3 + 0.15 * Math.sin(t * 2 + i));
  }
  if (scene.fx === "sparks") {
    for (let i = 0; i < 90; i++) {
      const sp = 0.35 + R() * 0.4, off = R(), ph = R() * 6.28, dx = (R() - 0.5) * S * 0.08, sz = (2 + R() * 3) * k * 3;
      const life = (t * sp + off) % 1;
      glowDot(cx + dx + Math.sin(life * 6 + ph) * S * 0.04 * life, cy - life * S * 0.55, sz, "rgba(255,150,60,A)", (1 - life) * 0.85);
    }
    glowDot(cx, cy, S * 0.22, "rgba(255,120,40,A)", 0.2 * (0.7 + 0.3 * Math.sin(t * 9) * Math.sin(t * 4.3)));
    for (let i = 0; i < 120; i++) { const px = R() * W, py = R() * H * 0.4, ph = R() * 6.28; glowDot(px, py, S * 0.004, "rgba(255,245,230,A)", 0.3 + 0.4 * Math.sin(t * 3 + ph)); }
  }
  x.restore();
}

function scene(i, local) {
  const s = SCENES[i];
  const p = clamp(local / SEG);
  const map = cover(imgs[s.img], 1.06 + 0.09 * p, (i % 2 ? -0.012 : 0.012) * p);
  grade(s.tint);
  fx(s, local + i * 7, map);
}

function word(i, local) {
  const s = SCENES[i];
  const a = clamp((local - 0.25) / 0.6), out = i === SCENES.length - 1 ? 0 : clamp((local - (HOLD - 0.3)) / 0.3);
  const vis = easeOut(a) * (1 - out);
  if (vis <= 0) return;
  x.save();
  const fs = Math.round(S * (W > H ? 0.24 : 0.19));
  x.textAlign = "center"; x.direction = "rtl";
  const y = H * (W > H ? 0.62 : 0.58) + (1 - easeOut(a)) * fs * 0.2;
  x.globalAlpha = vis; x.shadowColor = "rgba(0,0,0,.5)"; x.shadowBlur = 50;
  x.font = `900 ${fs}px Alexandria`;
  x.fillStyle = "#fff"; x.fillText(s.word, W / 2, y);
  x.shadowBlur = 20; x.font = `500 ${Math.round(fs * 0.16)}px Alexandria`; x.globalAlpha = vis * 0.9;
  x.fillText(s.sub, W / 2, y + fs * 0.34);
  x.restore();
}

// انتقال الشق الضوئي: شق عمودي يفتح من المنتصف بحواف متوهجة
function slit(p, drawFrom, drawTo, tint) {
  const e = ease(p);
  drawFrom();
  x.save(); x.fillStyle = `rgba(5,2,9,${0.5 * clamp(p * 2)})`; x.fillRect(0, 0, W, H); x.restore();
  const half = (W / 2) * e * 1.02;
  x.save(); x.beginPath(); x.rect(W / 2 - half, 0, half * 2, H); x.clip(); drawTo(); x.restore();
  const edge = S * 0.07 * (1 - e * 0.6);
  for (const sx of [W / 2 - half, W / 2 + half]) {
    x.save(); x.globalCompositeOperation = "screen";
    const g = x.createLinearGradient(sx - edge, 0, sx + edge, 0);
    g.addColorStop(0, "rgba(255,200,140,0)"); g.addColorStop(0.5, `rgba(255,236,205,${0.95 * (1 - e * 0.7)})`); g.addColorStop(1, "rgba(255,200,140,0)");
    x.fillStyle = g; x.fillRect(sx - edge, 0, edge * 2, H);
    x.restore();
  }
  x.save(); x.globalCompositeOperation = "screen"; x.globalAlpha = Math.sin(Math.PI * p) * 0.3;
  x.fillStyle = tint; x.fillRect(0, 0, W, H); x.restore();
}

function dark() { x.fillStyle = "#07040c"; x.fillRect(0, 0, W, H); }

function outro(local) {
  scene(SCENES.length - 1, HOLD + local);
  x.save(); x.fillStyle = `rgba(6,3,10,${0.8 * easeOut(clamp(local / 0.9))})`; x.fillRect(0, 0, W, H); x.restore();
  const a = easeOut(clamp((local - 0.4) / 0.8)), b = easeOut(clamp((local - 1.0) / 0.8));
  x.save(); x.textAlign = "center"; x.direction = "rtl"; x.fillStyle = "#fff";
  const fs = Math.round(S * (W > H ? 0.13 : 0.11));
  x.globalAlpha = a; x.font = `800 ${fs}px Alexandria`;
  x.fillText("من الفكرة", W / 2, H * 0.45 + (1 - a) * 30);
  x.globalAlpha = b; x.fillText("لآخر ضيف.", W / 2, H * 0.45 + fs * 1.15 + (1 - b) * 30);
  const cc = easeOut(clamp((local - 1.7) / 0.7));
  x.globalAlpha = cc * 0.75; x.font = `500 ${Math.round(fs * 0.28)}px Alexandria`;
  x.fillText("مناسبتي", W / 2, H * 0.45 + fs * 1.95);
  x.restore();
}

window.render = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
  if (MODE === "film") {
    if (t < INTRO) { slit(clamp(t / INTRO), dark, () => scene(0, 0), SCENES[0].tint); return; }
    const u = t - INTRO;
    const lastStart = (SCENES.length - 1) * SEG;
    if (u >= lastStart + HOLD) { outro(u - lastStart - HOLD); return; }
    const i = Math.min(SCENES.length - 1, Math.floor(u / SEG)), local = u - i * SEG;
    if (local < HOLD) { scene(i, local); word(i, local); return; }
    slit((local - HOLD) / TRANS, () => scene(i, local), () => scene(i + 1, 0), SCENES[i + 1].tint);
    return;
  }
  const u = t % TOTAL, i = Math.floor(u / SEG), local = u - i * SEG;
  if (local < HOLD) { scene(i, local); return; }
  const n = (i + 1) % SCENES.length;
  slit((local - HOLD) / TRANS, () => scene(i, local), () => scene(n, 0), SCENES[n].tint);
};

window.ready = Promise.all([...SCENES.map((s) => load(s.img)), document.fonts.load("900 100px Alexandria"), document.fonts.load("800 100px Alexandria"), document.fonts.load("500 40px Alexandria")]).then(() => document.fonts.ready);
</script></body></html>
