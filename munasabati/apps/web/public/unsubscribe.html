<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إلغاء الرسائل التسويقية · مناسبتي</title>
<meta name="description" content="أوقف رسائل العروض التسويقية من مناسبتي.">
<link rel="icon" href="./favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
  :root { --bg: #faf9f7; --surface: #fff; --fg: #17130f; --muted: #6b625a; --line: #e8e2da; --gold: #86601f; --brand: #d1185a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0b09; --surface: #17120e; --fg: #f4ece0; --muted: #a8998a; --line: #2e251d; --gold: #e2bd7a; --brand: #ff5c93; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif; font-size: 16px; line-height: 1.85; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 36px max(18px, env(safe-area-inset-right)) 70px max(18px, env(safe-area-inset-left)); }
  a { color: var(--brand); }
  header { display: grid; gap: 8px; margin-bottom: 26px; }
  .brand { font-family: Alexandria, sans-serif; font-weight: 800; font-size: 20px; text-decoration: none; color: var(--fg); }
  h1 { font-family: Alexandria, sans-serif; font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; margin: 6px 0 0; }
  h2 { font-family: Alexandria, sans-serif; font-weight: 800; font-size: 21px; margin: 34px 0 8px; padding-top: 22px; border-top: 1px solid var(--line); }
  h3 { font-size: 16.5px; margin: 18px 0 4px; }
  p, li { color: var(--fg); }
  .muted { color: var(--muted); font-size: 14px; }
  ul { padding-inline-start: 22px; margin: 6px 0; }
  li { margin: 4px 0; }
  nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  nav.toc a { text-decoration: none; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin: 12px 0; }
  .eyebrow { color: var(--gold); font-family: Alexandria, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .06em; }
</style>
<style>
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 10px 0; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: start; vertical-align: top; }
  th { background: var(--surface); font-weight: 600; }
  .tbl { overflow-x: auto; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="brand" href="./index.html">مناسبتي</a><span class="eyebrow">الرسائل التسويقية</span><h1>أوقف رسائل العروض</h1></header>
  <p>اكتب رقم جوالك، ونوقف أي رسائل عروض أو أفكار تسويقية منا. الرسائل الخاصة بحجزك أو طلبك تستمر لأنها جزء من الخدمة.</p>
  <form id="f" class="box" style="display:grid;gap:10px">
    <label for="ph">رقم الجوال</label>
    <input id="ph" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="05xxxxxxxx" required style="font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)">
    <button style="font:inherit;font-weight:600;padding:10px 14px;border-radius:12px;border:0;background:var(--brand);color:#fff;cursor:pointer">أوقف الرسائل</button>
    <p id="msg" role="status" aria-live="polite" class="muted" style="margin:0"></p>
  </form>
  <p style="margin-top:34px"><a href="./index.html">← الرجوع لمناسبتي</a> · <a href="./privacy.html">الخصوصية</a></p>
</div>
<script>
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault(); var m = document.getElementById("msg"); m.textContent = "لحظة...";
    fetch("https://yejsuchjmomoaaphazre.supabase.co/rest/v1/rpc/marketing_unsubscribe", { method: "POST", headers: { apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllanN1Y2hqbW9tb2FhcGhhenJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNjM0NDksImV4cCI6MjEwOTczOTQ0OX0.8Bi2erIZuT6ozz9WLPfXkLms-e94F88nOr62ZCMYXM8", "Content-Type": "application/json" }, body: JSON.stringify({ p_phone: document.getElementById("ph").value }) })
      .then(function (r) { return r.json(); }).then(function (ok) { m.textContent = ok === true ? "تم. ما راح توصلك رسائل تسويقية منا. ونرسل لك تأكيد." : "تأكد من الرقم (يبدأ بـ 05)."; })
      .catch(function () { m.textContent = "صار خطأ، جرّب بعد شوي أو تواصل مع الدعم."; });
  });
</script>
</body>
</html>
