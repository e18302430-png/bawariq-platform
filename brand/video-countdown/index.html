<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مناسبتي · العد التنازلي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=block">
<style>
:root { --ink: #FFF8F0; --gold: #FFD27A; --rose: #FF3D7F; --grad: linear-gradient(135deg, #FFB36B 0%, #FF6B5A 28%, #E5195E 60%, #9B3FC9 100%); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { font-family: "Cairo", Tahoma, sans-serif; color: var(--ink); }
#wrap { position: absolute; inset: 0; display: grid; place-items: center; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(100% 70% at 50% 40%, #2A1030 0%, #07030a 75%); transform-origin: center; }
.abs { position: absolute; will-change: transform, opacity; }

/* الخلفيات: كل يوم صورة تدخل بشرائح أفقية */
.bg { position: absolute; inset: 0; overflow: hidden; will-change: transform, opacity; }
.slice { position: absolute; left: 0; width: 1080px; height: 240px; background-repeat: no-repeat; will-change: transform; }
#dim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,2,8,.82) 0%, rgba(5,2,8,.45) 35%, rgba(5,2,8,.5) 55%, rgba(5,2,8,.88) 100%); }

/* الرقم الكبير */
#top { left: 0; right: 0; top: 250px; text-align: center; font-size: 54px; font-weight: 800; color: var(--gold); letter-spacing: 0; }
#num { position: absolute; left: 0; right: 0; top: 380px; height: 560px; overflow: hidden; text-align: center; }
#num span { position: absolute; left: 0; right: 0; top: 0; font-size: 520px; font-weight: 900; line-height: 560px; color: #fff; text-shadow: 0 30px 80px rgba(0,0,0,.6); will-change: transform; }
#unit { left: 0; right: 0; top: 930px; text-align: center; font-size: 80px; font-weight: 900; }

/* بطاقة المهمة */
#card { left: 90px; right: 90px; top: 1150px; padding: 36px 40px; border-radius: 44px; background: rgba(18,8,20,.62); border: 2px solid rgba(255,255,255,.14); backdrop-filter: blur(18px); display: flex; align-items: center; gap: 34px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.8); }
#check { position: relative; flex: none; width: 150px; height: 150px; }
#check .c { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE7B0, #FFB84D 55%, #E08A1E); box-shadow: 0 16px 40px rgba(255,184,77,.5); will-change: transform; }
#check svg { position: absolute; inset: 30px; width: 90px; height: 90px; will-change: transform; }
#check .ring { position: absolute; inset: -10px; border-radius: 50%; border: 6px solid var(--gold); will-change: transform, opacity; }
#ctext b { display: block; font-size: 92px; font-weight: 900; line-height: 1.1; }
#ctext small { display: block; margin-top: 6px; font-size: 48px; font-weight: 800; color: var(--gold); }

#q { left: 0; right: 0; top: 1200px; text-align: center; font-size: 96px; font-weight: 900; color: var(--rose); text-shadow: 0 10px 40px rgba(0,0,0,.6); }

/* الليلة */
#night { left: 0; right: 0; top: 700px; text-align: center; font-size: 250px; font-weight: 900; line-height: 1.1; }
#night span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
#burst { position: absolute; left: 50%; top: 45%; width: 1800px; height: 1800px; margin: -900px 0 0 -900px; border-radius: 50%; background: radial-gradient(circle, rgba(255,245,220,.95) 0%, rgba(255,170,90,.55) 22%, rgba(229,25,94,.22) 45%, transparent 68%); will-change: transform, opacity; }
#rays { position: absolute; left: 50%; top: 45%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; background: repeating-conic-gradient(from 0deg, rgba(255,210,122,.25) 0deg 4deg, transparent 4deg 13deg); -webkit-mask: radial-gradient(circle, #000 0%, transparent 60%); mask: radial-gradient(circle, #000 0%, transparent 60%); will-change: transform, opacity; }
.line { left: 0; right: 0; text-align: center; font-weight: 900; text-shadow: 0 16px 50px rgba(0,0,0,.7); }

/* الختام */
#logo { left: 315px; top: 470px; width: 450px; height: 450px; object-fit: contain; }
#e1 { top: 960px; font-size: 112px; }
#e1 span, .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
#e2 { top: 1150px; font-size: 50px; color: var(--gold); font-weight: 800; }
#e3 { left: 50%; top: 1290px; transform: translateX(-50%); direction: ltr; white-space: nowrap; font-size: 42px; font-weight: 800; padding: 16px 44px; border-radius: 999px; background: var(--grad); color: #fff; box-shadow: 0 30px 60px -24px rgba(229,25,94,.8); }

#grain { position: absolute; inset: 0; background-size: 1080px 1920px; mix-blend-mode: overlay; opacity: .13; pointer-events: none; }
#vig { position: absolute; inset: 0; background: radial-gradient(75% 55% at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%); pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

#ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 16px; background: rgba(20,12,22,.88); border: 1px solid rgba(255,255,255,.12); font: 700 13px "Cairo", sans-serif; color: #fff; max-width: calc(100vw - 20px); }
#ui button, #ui label { cursor: pointer; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 6px 12px; font: inherit; }
#ui input[type=range] { width: 220px; accent-color: #E5195E; }
#ui input[type=file] { display: none; }
#ui .t { min-width: 84px; text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }
body.rec #ui { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="vblur" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur id="vb" stdDeviation="0 0"/></filter></svg>
<div id="wrap"><div id="stage">
  <div id="bgs"></div>
  <div id="dim"></div>
  <div id="burst"></div><div id="rays"></div>

  <div class="abs" id="top">باقي على ليلة العمر</div>
  <div id="num"><span id="ncur">٢١</span><span id="nnxt"></span></div>
  <div class="abs" id="unit">يوم</div>
  <div class="abs" id="q">وما حجزت شي؟</div>

  <div class="abs" id="card">
    <div id="check"><div class="ring"></div><div class="c"></div><svg viewBox="0 0 24 24" fill="none" stroke="#3A1A05" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path id="tick" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div id="ctext"><b id="ctitle">القاعة</b><small id="cst">محجوزة</small></div>
  </div>

  <div class="abs" id="night"><span>الليلة.</span></div>
  <div class="abs line" id="l1" style="top:1260px;font-size:110px">وأنت…</div>
  <div class="abs line" id="l2" style="top:1400px;font-size:104px">ولا <span class="g">شلت هم.</span></div>

  <img class="abs" id="logo" src="logo.png" alt="مناسبتي">
  <div class="abs line" id="e1">مناسبتك <span>علينا.</span></div>
  <div class="abs line" id="e2">من الفكرة… لآخر ضيف</div>
  <div class="abs" id="e3">munasabati-sigma.vercel.app</div>

  <div id="vig"></div><div id="grain"></div><div id="black"></div><div id="flash"></div>
</div></div>

<div id="ui">
  <button id="play">تشغيل</button><button id="restart">من البداية</button>
  <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="الوقت">
  <span class="t" id="time">0.00 / 30.00</span><button id="fs">ملء الشاشة</button>
  <label>موسيقى<input type="file" id="upMusic" accept="audio/*"></label>
</div>
<audio id="music" src="audio/mix.m4a" preload="auto"></audio>

<script>
/* ═══ الخط الزمني ═══ */
const DUR = 30;
// الأيام: الرقم، الخلفية، المهمة، الحالة، وقت الدخول
const DAYS = [
  { n: "٢١", img: "img/f1-wedding.webp", land: true, title: "القاعة", st: "محجوزة", at: 4.0 },
  { n: "١٤", img: "img/f2-milka.webp", land: true, title: "الكوشة", st: "تتجهز", at: 7.0 },
  { n: "٧", img: "img/invite.png", land: false, title: "الدعوات", st: "وصلت للضيوف", at: 10.0 },
  { n: "٣", img: "img/f3-coffee.webp", land: true, title: "الضيافة", st: "مؤكدة", at: 13.0 },
  { n: "١", img: "img/f4-rooftop.webp", land: true, title: "العربون", st: "محفوظ عبر المنصة", at: 15.8 },
];
const HOURS = [["٢٤", 18.4], ["١٢", 18.8], ["٦", 19.15], ["٣", 19.45], ["١", 19.72]];
const SILENT = [20.3, 20.8], NIGHT = 20.8, END = 25.5;

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - x, 3), eo5 = (x) => 1 - Math.pow(1 - x, 5);
const ei = (x) => x * x * x;
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 2.0; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const p = (t, a, b, e = eo) => e(clamp((t - a) / (b - a)));
const css = (el, o, tr) => { el.style.opacity = o; el.style.transform = tr || ""; };
const hit = (t, a, d = .25) => (t >= a && t < a + d ? 1 - (t - a) / d : 0);

/* بناء الخلفيات: ٨ شرائح لكل صورة */
const BGS = [...DAYS.map((d) => d), { img: "img/f1-wedding.webp", land: true, at: NIGHT }].map((d, i) => {
  const box = document.createElement("div"); box.className = "bg";
  const W = d.land ? 3413 : 1080, H = d.land ? 1920 : 2337, ox = -(W - 1080) / 2, oy = -(H - 1920) / 2;
  const slices = [];
  for (let k = 0; k < 8; k++) {
    const s = document.createElement("div"); s.className = "slice";
    s.style.top = k * 240 + "px"; s.style.backgroundImage = `url(${d.img})`;
    s.style.backgroundSize = `${W}px ${H}px`; s.style.backgroundPosition = `${ox}px ${oy - k * 240}px`;
    box.appendChild(s); slices.push(s);
  }
  $("bgs").appendChild(box);
  return { box, slices, at: d.at };
});

/* الرقم يلف مثل العداد: القديم يطلع فوق والجديد يجي من تحت */
const NH = 560;
function numberAt(t) {
  const seq = [["٢١", 0], ...DAYS.slice(1).map((d) => [d.n, d.at]), ...HOURS];
  let i = 0; while (i + 1 < seq.length && t >= seq[i + 1][1]) i++;
  const cur = seq[i], prev = seq[i - 1];
  const dur = cur[1] >= 18.4 ? .22 : .4;
  const k = i > 0 ? p(t, cur[1], cur[1] + dur, back) : 1;
  return { cur: cur[0], prev: prev ? prev[0] : "", k, rolling: i > 0 && t < cur[1] + dur, speed: i > 0 ? (1 - p(t, cur[1], cur[1] + dur)) : 0 };
}

function render(t) {
  t = clamp(t, 0, DUR);
  let flash = 0;

  /* الخلفيات */
  BGS.forEach((b, i) => {
    const on = t >= b.at && (i === BGS.length - 1 || t < (BGS[i + 1].at + .6)) && !(t >= SILENT[0] && t < NIGHT);
    b.box.style.visibility = on && t < END + .4 ? "visible" : "hidden";
    if (!on) return;
    b.slices.forEach((s, k) => { const q = p(t, b.at + k * .035, b.at + .45 + k * .035, eo5); s.style.transform = `translateX(${(k % 2 ? 1 : -1) * 1100 * (1 - q)}px)`; });
    const isNight = i === BGS.length - 1;
    const push = isNight ? 1.25 - .2 * p(t, NIGHT, NIGHT + .6, eo5) + .06 * p(t, NIGHT + .6, END, (x) => x) : 1.04 + .08 * p(t, b.at, b.at + 3.2, (x) => x);
    b.box.style.transform = `scale(${push})`;
    b.box.style.filter = isNight ? `brightness(${.75 + .45 * hit(t, NIGHT, .9)}) saturate(1.2)` : "saturate(1.1)";
  });
  $("dim").style.opacity = t >= NIGHT ? .55 : 1;

  /* العنوان والرقم */
  const inCount = t >= .35 && t < SILENT[0];
  css($("top"), inCount ? p(t, .35, .8) : 0, `translateY(${(1 - p(t, .35, .8)) * 20}px)`);
  const nm = numberAt(t), cur = $("ncur"), nx = $("nnxt");
  const slam = p(t, .4, .62, back);
  if (inCount) {
    if (nm.rolling) {
      cur.textContent = nm.prev; nx.textContent = nm.cur;
      cur.style.transform = `translateY(${-NH * nm.k}px)`; nx.style.transform = `translateY(${NH * (1 - nm.k)}px)`; nx.style.opacity = 1;
      $("vb").setAttribute("stdDeviation", `0 ${(nm.speed * 30).toFixed(1)}`); $("num").style.filter = "url(#vblur)";
    } else {
      cur.textContent = nm.cur; cur.style.transform = t < 1 ? `scale(${1.6 - .6 * slam})` : "none"; nx.style.opacity = 0;
      $("num").style.filter = "none";
    }
    $("num").style.opacity = t < .4 ? 0 : 1;
  } else $("num").style.opacity = 0;
  const unit = $("unit"); unit.textContent = t >= HOURS[0][1] ? "ساعة" : "يوم";
  css(unit, inCount ? p(t, .55, .9) : 0, `scale(${1 + .08 * hit(t, HOURS[0][1], .2)})`);
  DAYS.forEach((d, i) => { if (i) flash = Math.max(flash, hit(t, d.at, .12) * .35); });
  HOURS.forEach(([, a]) => { flash = Math.max(flash, hit(t, a, .08) * .25); });

  /* «وما حجزت شي؟» */
  const qi = p(t, 1.6, 1.85, back), qo = p(t, 3.55, 3.85, eio);
  css($("q"), t >= 1.6 && t < 3.85 ? 1 - qo : 0, `scale(${1.4 - .4 * qi}) translateX(${Math.sin(t * 40) * 6 * (t > 2 && t < 3.5 ? 1 : 0)}px)`);

  /* بطاقة المهمة والختم */
  const di = DAYS.findIndex((d, i) => t >= d.at && (i === DAYS.length - 1 ? t < 18.3 : t < DAYS[i + 1].at));
  const card = $("card");
  if (di >= 0) {
    const d = DAYS[di]; $("ctitle").textContent = d.title; $("cst").textContent = d.st;
    const ci = p(t, d.at + .25, d.at + .6, back), co = di === DAYS.length - 1 ? p(t, 18.0, 18.3, eio) : p(t, DAYS[di + 1].at - .2, DAYS[di + 1].at, eio);
    css(card, ci * (1 - co), `translateY(${(1 - ci) * 120}px) scale(${.92 + .08 * ci})`);
    const st = p(t, d.at + .55, d.at + .8, back);
    $("check").querySelector(".c").style.transform = `scale(${st})`;
    $("check").querySelector("svg").style.transform = `scale(${st}) rotate(${(1 - st) * -30}deg)`;
    const rg = $("check").querySelector(".ring"), r = p(t, d.at + .6, d.at + 1.1);
    rg.style.opacity = t >= d.at + .6 ? 1 - r : 0; rg.style.transform = `scale(${1 + r * .9})`;
    $("ctext").style.opacity = p(t, d.at + .45, d.at + .75);
  } else card.style.opacity = 0;

  /* الصمت ثم «الليلة.» */
  $("black").style.opacity = t >= SILENT[0] && t < NIGHT ? 1 : (t >= 19.9 && t < SILENT[0] ? p(t, 19.9, SILENT[0]) * .6 : 0);
  const ni = p(t, NIGHT, NIGHT + .3, back), no = p(t, 22.2, 22.5, eio);
  css($("night"), t >= NIGHT && t < 22.5 ? 1 - no : 0, `scale(${1.9 - .9 * ni + .05 * p(t, NIGHT, 22.2, (x) => x)})`);
  const bi = p(t, NIGHT, NIGHT + .45, eo5);
  css($("burst"), t >= NIGHT && t < END ? (1 - .6 * p(t, NIGHT + .3, NIGHT + 1.6)) * (1 - p(t, END - .3, END)) : 0, `scale(${.2 + 1.2 * bi})`);
  css($("rays"), t >= NIGHT && t < END ? .8 * (1 - p(t, END - .3, END)) : 0, `rotate(${(t - NIGHT) * 12}deg) scale(${.6 + .5 * bi})`);
  flash = Math.max(flash, hit(t, NIGHT, .45));
  [["l1", 22.4], ["l2", 23.3]].forEach(([id, a]) => { const k = p(t, a, a + .3, back), o = p(t, END - .3, END, eio); css($(id), t >= a && t < END ? 1 - o : 0, `scale(${1.5 - .5 * k})`); });

  /* الختام */
  const e = END, lg = p(t, e, e + .4, back);
  css($("logo"), t >= e ? 1 : 0, `scale(${2 - 1 * lg})`);
  if (t >= e) { css($("burst"), .6 - .35 * p(t, e + .2, e + 1.5), `scale(${.3 + 1 * p(t, e, e + .4, eo5)})`); css($("rays"), .55, `rotate(${(t - e) * 10}deg) scale(1)`); flash = Math.max(flash, hit(t, e, .35)); }
  [["e1", e + .5, back], ["e2", e + 1.0, eo]].forEach(([id, a, f]) => { const k = p(t, a, a + .35, f); css($(id), t >= a ? k : 0, `scale(${1.3 - .3 * k})`); });
  const k3 = p(t, e + 1.4, e + 1.8, back); css($("e3"), t >= e + 1.4 ? k3 : 0, `translateX(-50%) scale(${.6 + .4 * k3})`);

  $("flash").style.opacity = flash * .8;
  $("grain").style.backgroundImage = `url(grain/g${Math.floor(t * 24) % 6}.png)`;
  const sh = Math.max(hit(t, NIGHT, .45), hit(t, e, .35), hit(t, .4, .2)) * 16;
  $("stage").style.transform = (document.body.classList.contains("rec") ? "" : `scale(${window.__fit || 1}) `) + `translate(${Math.sin(t * 90) * sh}px, ${Math.cos(t * 77) * sh}px)`;
}
window.__render = render; window.__DUR = DUR;

/* ═══ المعاينة ═══ */
const music = $("music"), seek = $("seek"), timeEl = $("time");
let playing = false, t0 = 0, base = 0, raf = 0;
const now = () => (playing ? (music.src && !music.error && music.readyState >= 2 ? music.currentTime : base + (performance.now() - t0) / 1000) : base);
function loop() { const t = now(); if (t >= DUR) { pause(); base = DUR; } render(t); seek.value = t; timeEl.textContent = `${t.toFixed(2)} / ${DUR.toFixed(2)}`; if (playing) raf = requestAnimationFrame(loop); }
function play() { if (base >= DUR) base = 0; playing = true; t0 = performance.now(); try { music.currentTime = base; void music.play(); } catch { /* */ } $("play").textContent = "إيقاف"; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
function pause() { base = now(); playing = false; music.pause(); $("play").textContent = "تشغيل"; cancelAnimationFrame(raf); }
$("play").onclick = () => (playing ? pause() : play());
$("restart").onclick = () => { pause(); base = 0; try { music.currentTime = 0; } catch { /* */ } play(); };
seek.oninput = () => { base = +seek.value; try { music.currentTime = base; } catch { /* */ } t0 = performance.now(); render(base); timeEl.textContent = `${base.toFixed(2)} / ${DUR.toFixed(2)}`; };
$("fs").onclick = () => document.documentElement.requestFullscreen?.();
const fit = () => { window.__fit = Math.min(innerWidth / 1080, (innerHeight - 70) / 1920); render(+seek.value); };
addEventListener("resize", fit);
$("upMusic").onchange = (e) => { const f = e.target.files[0]; if (f) { pause(); music.src = URL.createObjectURL(f); base = 0; } };
if (new URLSearchParams(location.search).has("record")) { document.body.classList.add("rec"); $("wrap").style.placeItems = "start"; }
else fit();
render(0);
</script>
</body>
</html>
